<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>personal-agent</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --panel: #ffffff;
        --border: #e5e5e5;
        --muted: #666;
        --user: #d8ecff;
        --agent: #f1f1f1;
        --text: #111;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1a;
          --panel: #232323;
          --border: #333;
          --muted: #aaa;
          --user: #1f3b5b;
          --agent: #2c2c2c;
          --text: #f0f0f0;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
      }
      .app {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 800px;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header .title { font-weight: 600; }
      header .label { color: var(--muted); font-size: 12px; }
      header button {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 4px;
        cursor: pointer;
      }
      header button:hover { background: var(--border); }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        max-width: 80%;
        padding: 8px 12px;
        border-radius: 10px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .msg.user { background: var(--user); align-self: flex-end; }
      .msg.agent { background: var(--agent); align-self: flex-start; }
      .msg.error {
        background: #fee;
        color: #900;
        align-self: flex-start;
        border: 1px solid #fbb;
      }
      .msg.thinking { color: var(--muted); font-style: italic; align-self: flex-start; }
      form {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        background: var(--panel);
      }
      textarea {
        flex: 1;
        resize: none;
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        min-height: 38px;
        max-height: 200px;
      }
      button[type="submit"] {
        font: inherit;
        padding: 0 16px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
      button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <div class="title">personal-agent</div>
          <div class="label" id="label">…</div>
        </div>
        <button id="new-session" type="button">New session</button>
      </header>
      <div id="messages"></div>
      <form id="form">
        <textarea
          id="input"
          rows="1"
          placeholder="Message the agent… (Enter to send, Shift+Enter for newline)"
          autofocus
        ></textarea>
        <button type="submit" id="send">Send</button>
      </form>
    </div>
    <script>
      const SESSION_KEY = "personal-agent.sessionId";
      const messagesEl = document.getElementById("messages");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const labelEl = document.getElementById("label");
      const newSessionBtn = document.getElementById("new-session");

      function appendMessage(role, text) {
        const div = document.createElement("div");
        div.className = "msg " + role;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
      }

      async function loadInfo() {
        try {
          const r = await fetch("/api/info");
          const data = await r.json();
          labelEl.textContent = data.label ?? "";
        } catch {
          labelEl.textContent = "(offline)";
        }
      }

      function autoSize() {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 200) + "px";
      }

      input.addEventListener("input", autoSize);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      newSessionBtn.addEventListener("click", () => {
        localStorage.removeItem(SESSION_KEY);
        messagesEl.innerHTML = "";
        appendMessage("agent", "(new session — previous context cleared)");
        input.focus();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        appendMessage("user", text);
        input.value = "";
        autoSize();
        sendBtn.disabled = true;
        input.disabled = true;
        const thinking = appendMessage("thinking", "thinking…");

        try {
          const r = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              message: text,
              sessionId: localStorage.getItem(SESSION_KEY) || undefined,
            }),
          });
          const data = await r.json();
          thinking.remove();
          if (!r.ok) {
            appendMessage("error", "error: " + (data.error ?? r.statusText));
          } else {
            if (data.sessionId) localStorage.setItem(SESSION_KEY, data.sessionId);
            appendMessage("agent", data.reply ?? "(empty reply)");
          }
        } catch (err) {
          thinking.remove();
          appendMessage("error", "network error: " + (err?.message ?? err));
        } finally {
          sendBtn.disabled = false;
          input.disabled = false;
          input.focus();
        }
      });

      loadInfo();
    </script>
  </body>
</html>
