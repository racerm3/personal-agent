<svg width="100%" viewBox="0 0 680 530" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Session threading sequence diagram</title>
<desc>Sequence diagram showing how a session_id flows from the SDK result back into the next query() call, enabling multi-turn conversational context across turns and across process restarts.</desc>

<rect x="0" y="0" width="680" height="530" fill="rgb(26,26,24)"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<mask id="gaps" maskUnits="userSpaceOnUse">
  <rect x="0" y="0" width="680" height="530" fill="white"/>
  <!-- Turn 1 labels -->
  <rect x="130" y="102" width="118" height="16" fill="black" rx="2"/>
  <rect x="353" y="138" width="156" height="16" fill="black" rx="2"/>
  <rect x="353" y="214" width="166" height="16" fill="black" rx="2"/>
  <rect x="94"  y="240" width="194" height="16" fill="black" rx="2"/>
  <!-- Turn 2 labels -->
  <rect x="94"  y="340" width="192" height="16" fill="black" rx="2"/>
  <rect x="330" y="377" width="210" height="16" fill="black" rx="2"/>
  <rect x="342" y="428" width="192" height="16" fill="black" rx="2"/>
  <rect x="94"  y="465" width="172" height="16" fill="black" rx="2"/>
</mask>
</defs>

<!-- ── Participant boxes ── -->

<!-- CLI -->
<rect x="20" y="30" width="120" height="40" rx="6" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
<text x="80" y="50" text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500">CLI</text>
<text x="80" y="64" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)" font-family="-apple-system, system-ui, sans-serif" font-size="12">cli.ts</text>

<!-- agent.ts -->
<rect x="240" y="30" width="140" height="40" rx="6" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
<text x="310" y="50" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500">agent.ts</text>
<text x="310" y="64" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="-apple-system, system-ui, sans-serif" font-size="12">runAgent()</text>

<!-- SDK -->
<rect x="490" y="30" width="170" height="40" rx="6" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
<text x="575" y="50" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500">Claude SDK</text>
<text x="575" y="64" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="-apple-system, system-ui, sans-serif" font-size="12">query()</text>

<!-- ── Lifelines ── -->
<line x1="80"  y1="70" x2="80"  y2="505" mask="url(#gaps)" stroke="rgb(156,154,146)" stroke-width="0.5" stroke-dasharray="4,3"/>
<line x1="310" y1="70" x2="310" y2="505" mask="url(#gaps)" stroke="rgb(156,154,146)" stroke-width="0.5" stroke-dasharray="4,3"/>
<line x1="575" y1="70" x2="575" y2="505" mask="url(#gaps)" stroke="rgb(156,154,146)" stroke-width="0.5" stroke-dasharray="4,3"/>

<!-- ══ Turn 1 — new session ══ -->
<text x="340" y="92" text-anchor="middle" fill="rgb(156,154,146)" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-style="italic">Turn 1 — new session</text>

<!-- "hello" CLI → agent -->
<text x="195" y="110" text-anchor="middle" fill="rgb(194,192,182)" font-family="-apple-system, system-ui, sans-serif" font-size="12">"hello"</text>
<line x1="80" y1="118" x2="308" y2="118" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- query() — no resume  agent → SDK -->
<text x="442" y="146" text-anchor="middle" fill="rgb(194,192,182)" font-family="-apple-system, system-ui, sans-serif" font-size="12">query() — no resume</text>
<line x1="310" y1="154" x2="573" y2="154" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- SDK decision box -->
<rect x="520" y="168" width="110" height="40" rx="4" fill="rgb(38,38,36)" stroke="rgba(222,220,209,0.3)" stroke-width="0.5"/>
<text x="575" y="183" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)" font-family="-apple-system, system-ui, sans-serif" font-size="11">new session created</text>
<text x="575" y="199" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="-apple-system, system-ui, sans-serif" font-size="11">session_id: "abc12345"</text>

<!-- result + session_id  SDK → agent -->
<text x="442" y="222" text-anchor="middle" fill="rgb(194,192,182)" font-family="-apple-system, system-ui, sans-serif" font-size="12">result { session_id: "abc12345" }</text>
<line x1="573" y1="230" x2="312" y2="230" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- "Hello!" agent → CLI -->
<text x="195" y="248" text-anchor="middle" fill="rgb(194,192,182)" font-family="-apple-system, system-ui, sans-serif" font-size="12">"Hello! How can I help?"</text>
<line x1="308" y1="256" x2="82" y2="256" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- CLI-side annotation: session saved -->
<rect x="15" y="267" width="158" height="22" rx="4" fill="rgb(38,38,36)" stroke="rgba(239,159,39,0.4)" stroke-width="0.5"/>
<text x="94" y="278" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="-apple-system, system-ui, sans-serif" font-size="11">persisted to session.json</text>

<!-- ══ Separator ══ -->
<line x1="20" y1="300" x2="660" y2="300" stroke="rgb(80,78,72)" stroke-width="0.75" stroke-dasharray="6,4"/>
<text x="340" y="315" text-anchor="middle" fill="rgb(100,98,90)" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-style="italic">later — same run or after restarting with npm start</text>

<!-- ══ Turn 2 — resumed session ══ -->
<text x="340" y="332" text-anchor="middle" fill="rgb(156,154,146)" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-style="italic">Turn 2 — resumed session</text>

<!-- "what did I just say?" CLI → agent -->
<text x="195" y="348" text-anchor="middle" fill="rgb(194,192,182)" font-family="-apple-system, system-ui, sans-serif" font-size="12">"what did I just say?"</text>
<line x1="80" y1="357" x2="308" y2="357" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- query({ resume }) agent → SDK -->
<text x="442" y="385" text-anchor="middle" fill="rgb(194,192,182)" font-family="-apple-system, system-ui, sans-serif" font-size="12">query({ resume: "abc12345" })</text>
<line x1="310" y1="393" x2="573" y2="393" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- SDK decision box -->
<rect x="520" y="407" width="110" height="40" rx="4" fill="rgb(38,38,36)" stroke="rgba(222,220,209,0.3)" stroke-width="0.5"/>
<text x="575" y="422" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)" font-family="-apple-system, system-ui, sans-serif" font-size="11">full transcript</text>
<text x="575" y="438" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="-apple-system, system-ui, sans-serif" font-size="11">loaded from disk</text>

<!-- "You said hello." SDK → agent -->
<text x="442" y="464" text-anchor="middle" fill="rgb(194,192,182)" font-family="-apple-system, system-ui, sans-serif" font-size="12">"You said 'hello.' — want to continue?"</text>
<line x1="573" y1="473" x2="312" y2="473" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- agent → CLI -->
<text x="195" y="487" text-anchor="middle" fill="rgb(194,192,182)" font-family="-apple-system, system-ui, sans-serif" font-size="12">reply forwarded to CLI</text>
<line x1="308" y1="495" x2="82" y2="495" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

</svg>
